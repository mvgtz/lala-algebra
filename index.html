<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lala's Math • A little stronger every day</title><style>
:root{--ink:#202f35;--green:#285e51;--paper:#f7f6f0;--line:#dce1d8;--muted:#60736b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-weight:800;font-size:22px}nav{display:flex;gap:6px;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:var(--green);color:white;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e7a437;outline-offset:3px}button:disabled{opacity:.5;cursor:default}nav button{background:transparent;color:var(--muted);font-size:15px;padding:8px 12px}nav button[aria-current=page]{background:#e1e9de;color:var(--green)}main{max-width:1040px;margin:auto;padding:25px 28px 70px}h1{font-size:clamp(32px,5vw,52px);line-height:1.13;letter-spacing:-2px;margin:12px 0 20px}h2{font-size:25px;line-height:1.3}p{margin:12px 0}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}.muted,small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:28px;margin:20px 0}.hero{background:#e6eddf;padding:36px;border-radius:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.grid .card{margin:0}.big{font-size:36px;font-weight:800}.pill{display:inline-block;border-radius:30px;padding:4px 12px;background:#e9efe5;color:var(--green);font-size:13px}.math{font-size:clamp(23px,4vw,34px);font-weight:650;line-height:1.5;margin:24px 0;white-space:pre-wrap}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:white;border:2px solid var(--line);color:var(--ink);text-align:left;min-height:66px}.choice:hover{border-color:var(--green);background:#f0f5ed}.feedback{padding:18px;border-radius:12px;background:#fff3da;margin:18px 0}.success{background:#e4f1e4}progress{width:100%;height:12px;accent-color:var(--green)}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.scroll{overflow-x:auto}label{display:block;margin:12px 0}input,select{padding:8px;border:1px solid #bcc9be;border-radius:8px;max-width:100%}.secondary{background:#e8eee3;color:var(--green)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}footer{font-size:13px;color:var(--muted);margin-top:32px}.note{border-left:4px solid #c1d4bb;padding-left:16px}a{color:var(--green)}@media(max-width:560px){header,main{padding:18px}.card,.hero{padding:22px}.choices{grid-template-columns:1fr}nav button{padding:6px 8px}h1{letter-spacing:-1px}}@media print{header,button,.actions{display:none}body{background:white}.card{break-inside:avoid}}
</style><header><div class="brand">✳ Lala's math</div><nav aria-label="Main"><button data-view="home">Today</button><button data-view="schedule">Study plan</button><button data-view="skills">Skills</button><button data-view="results">Results</button></nav></header><main id="app"></main><script src="app.js"></script></html>
